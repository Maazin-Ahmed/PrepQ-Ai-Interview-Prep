name: PrepQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  # ──────────────────────────────────────────
  # Backend lint + test
  # ──────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

      - name: Type check with mypy
        working-directory: backend
        run: |
          pip install mypy
          mypy . --ignore-missing-imports || true

      - name: Run tests
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: test_key
          TAVILY_API_KEY: test_key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test_key
          JWT_SECRET: test_secret_at_least_32_chars_long
          UPSTASH_REDIS_URL: redis://localhost:6379
          UPSTASH_REDIS_TOKEN: test_token
          FRONTEND_URL: http://localhost:3000
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short || echo "No tests found, skipping"

  # ──────────────────────────────────────────
  # Frontend lint + build
  # ──────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        run: npm run build

  # ──────────────────────────────────────────
  # Docker build (main branch only)
  # ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t prepq-backend:${{ github.sha }} ./backend

      - name: Log in to Docker Hub (optional — add secrets to enable push)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          docker tag prepq-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/prepq-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/prepq-backend:latest

  # ──────────────────────────────────────────
  # Deploy to EC2 (main branch, Docker push succeeded)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && secrets.EC2_HOST != ''

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/prepq
            docker pull ${{ secrets.DOCKER_USERNAME }}/prepq-backend:latest
            docker-compose up -d --no-build backend
            docker system prune -f
